name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax check
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq luajit
          for f in *.lua; do luajit -e "assert(loadfile('$f'))"; done

      - name: Package
        id: package
        run: |
          zip=$(./build.sh)
          version=$(sed -n 's/^## Version: *//p' MacroHelper.toc | tr -d '\r')
          unzip -q "$zip" -d dist/unpacked
          echo "zip=$zip" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: MacroHelper-${{ steps.package.outputs.version }}
          path: dist/unpacked/MacroHelper

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "${{ steps.package.outputs.zip }}" --generate-notes
